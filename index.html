<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Cardápio Digital - Lanchonete</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Cardápio Digital</h1>

      <button
        id="btn-abrir-login"
        class="btn-secundario"
      >
        Área do Gestor / Login
      </button>
    </header>

    <main class="container">
      <section
        id="painel-admin"
        class="card-admin oculto"
      >
        <h2>Painel Administrativo</h2>

        <p>
          Faturamento Acumulado (Sessão):
          <strong id="faturamento-acumulado">
            R$ 0.00
          </strong>
        </p>

        <div class="area-vendas">
          <h3>Pedidos Pendentes</h3>
          <div id="vendas-pendentes"></div>
        </div>

        <div class="area-vendas">
          <h3>Vendas Finalizadas</h3>
          <div id="vendas-finalizadas"></div>
        </div>

        <form
          id="form-novo-produto"
          class="form-grid"
        >
          <h3>
            Adicionar Novo Produto ao Cardápio
          </h3>

          <input
            type="text"
            id="novo-nome"
            placeholder="Nome do Produto"
            required
          />

          <input
            type="text"
            id="novo-preco"
            placeholder="Preço Base (R$) - Ex.: 18,50"
            inputmode="decimal"
            required
          />

          <select id="novo-tipo">
            <option value="lanche">Lanche</option>
            <option value="bebida">Bebida</option>
          </select>

          <input
            type="url"
            id="novo-imagem"
            placeholder="URL da Imagem"
          />

          <p
            id="mensagem-produto"
            class="mensagem-form"
          ></p>

          <button
            type="submit"
            class="btn-principal"
          >
            Cadastrar Produto
          </button>
        </form>
      </section>

      <section>
        <h2>Nosso Cardápio</h2>

        <div
          id="cardapio-container"
          class="grid-cardapio"
        ></div>
      </section>
    </main>

    <button
      id="btn-acompanhar-carrinho"
      class="btn-flutuante"
    >
      🛒 Acompanhar meu carrinho
      <span id="cart-badge" class="badge">0</span>
    </button>

    <div id="modal-carrinho" class="modal">
      <div class="modal-conteudo">
        <span
          id="fechar-carrinho"
          class="btn-fechar"
        >
          &times;
        </span>

        <h2>Meu Carrinho de Compras</h2>

        <div id="itens-carrinho"></div>

        <div class="rodape-carrinho">
          <p>
            Total Parcial:
            <strong id="total-carrinho">
              R$ 0.00
            </strong>
          </p>

          <button
            id="btn-encerrar-pedido"
            class="btn-principal"
          >
            Enviar Pedido
          </button>
        </div>
      </div>
    </div>

    <div id="modal-login" class="modal">
      <div class="modal-conteudo">
        <span
          id="fechar-login"
          class="btn-fechar"
        >
          &times;
        </span>

        <h2>Login Administrativo</h2>

        <form id="form-login">
          <input
            type="text"
            id="login-usuario"
            placeholder="Usuário (admin)"
            autocomplete="username"
            required
          />

          <input
            type="password"
            id="login-senha"
            placeholder="Senha (admin)"
            autocomplete="current-password"
            required
          />

          <button
            type="submit"
            class="btn-principal"
          >
            Entrar
          </button>
        </form>
      </div>
    </div>

    <script
      type="module"
      src="dist/app.js"
    ></script>
  </body>
</html>
